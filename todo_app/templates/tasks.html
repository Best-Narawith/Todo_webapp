{% extends "base.html" %}
{% block title %}
<title>Todo list</title>
{% endblock %}

{% block content %}
    <noscript>หน้านี้ต้องใช้ JavaScript — กรุณาเปิดใช้งานแล้วโหลดหน้าใหม่</noscript>
    <header>
        <h1>My Tasks</h1>
    </header>
    <ul id="task-list">
        <li>กำลังโหลด...</li>
    </ul>
    <form action="" class="add-task-form">
        <label for="new-task">New task name</label>
        <input type="text" name="new-task" id="new-task">
        <input type="submit" id="add-task-btn" value="Add task" disabled>
    </form>
    <p id ="task-count">กำลังโหลด...</p><br>
    <a href="{{url_for('auth.logout')}}">log out</a>
    <script src="{{ url_for('static', filename = 'app.js') }}"></script>
{% endblock %}
